<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offer 对比看板</title><style>/*STYLE*/</style></head>
<body><main>
<header><div><p class="eyebrow">职业选择 · 条件核实 · 谈薪准备</p><h1>Offer 对比看板</h1><p>把每个机会放在同一张桌上，先看事实，再做选择。</p></div><a class="button quiet" href="application-tracker.html">投递进度表 ↗</a></header>

<nav aria-label="看板视图"><button data-tab="overview" class="active">机会总览</button><button data-tab="compare">横向对比</button><button data-tab="detail">资料与核对</button><button data-tab="calc">薪酬测算</button><button data-tab="guide">使用与依据</button></nav>

</main>
<dialog id="editor"><form id="editForm"><div class="dialog-head"><h2 id="editTitle">编辑</h2><button type="button" id="cancelEdit" class="quiet">关闭</button></div><div id="editBody"></div><p id="editError" role="alert"></p><button type="submit">保存</button></form></dialog>
